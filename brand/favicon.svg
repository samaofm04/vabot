<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Youlab">
  <title>Youlab</title>
  <defs>
    <linearGradient id="corps" x1="32" y1="10" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a55ee0"/>
      <stop offset=".55" stop-color="#7b32c4"/>
      <stop offset="1" stop-color="#4b1785"/>
    </linearGradient>
    <linearGradient id="lettre" x1="32" y1="18" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0dcff"/>
      <stop offset=".5" stop-color="#c79af0"/>
      <stop offset="1" stop-color="#9a58d8"/>
    </linearGradient>
    <linearGradient id="biseau" x1="10" y1="14" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cf9bf5" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#8b46d0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f0d55" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- ecusson : contour sombre -->
  <path d="M32 22 L25.5 13.5 H13 L8.5 18 V31 L32 57.5 L55.5 31 V18 L51 13.5 H38.5 Z"
        fill="#2b0b4d"/>

  <!-- corps -->
  <path d="M32 24.4 L26.6 17.1 H14.2 L11 20.3 V29.8 L32 53.4 L53 29.8 V20.3 L49.8 17.1 H37.4 Z"
        fill="url(#corps)"/>

  <!-- biseau -->
  <path d="M32 24.4 L26.6 17.1 H14.2 L11 20.3 V29.8 L32 53.4 L53 29.8 V20.3 L49.8 17.1 H37.4 Z"
        fill="url(#biseau)" opacity=".55"/>

  <!-- events lateraux : lisibles en grand, s effacent en petit -->
  <g fill="#e9d4ff" opacity=".16">
    <rect x="17.5" y="27" width="2.6" height="9" rx="1"/>
    <rect x="22"   y="30" width="2.6" height="9" rx="1"/>
    <rect x="39.4" y="30" width="2.6" height="9" rx="1"/>
    <rect x="43.9" y="27" width="2.6" height="9" rx="1"/>
  </g>

  <!-- le Y -->
  <path d="M16.6 18.6 H26.2 L32 29.4 L37.8 18.6 H47.4 L35.6 38.8 V49.6 L32 54.2 L28.4 49.6 V38.8 Z"
        fill="url(#lettre)"/>
  <path d="M16.6 18.6 H26.2 L32 29.4 L37.8 18.6 H47.4 L35.6 38.8 V49.6 L32 54.2 L28.4 49.6 V38.8 Z"
        fill="none" stroke="#f6e9ff" stroke-width=".7" opacity=".5"/>
</svg>
